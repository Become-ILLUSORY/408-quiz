name: Daily 408 Paper

# 每天 UTC 00:00 运行 = 北京时间（UTC+8）08:00
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai   # 保证 date.today() 与文件名都按北京时间
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成今日试卷与列表页
        run: |
          python3 make_paper.py
          python3 gen_index.py

      - name: 提交试卷到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/ index.html
          if git diff --cached --quiet; then
            echo "今日试卷无变化（可能已生成过），跳过提交"
          else
            git commit -m "每日组卷 $(date +%F)"
            git push
          fi

      - name: 准备 Pages 发布内容
        run: |
          mkdir -p _pages
          cp index.html _pages/
          cp -r papers _pages/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
