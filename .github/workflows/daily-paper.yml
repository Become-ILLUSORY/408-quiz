name: Daily 408 Paper

# 每天 UTC 00:00 运行 = 北京时间（UTC+8）08:00
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai   # 保证 date.today() 与文件名都按北京时间
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 题库自检
        run: python3 check_paper.py questions.json

      - name: 生成今日试卷与列表页
        run: |
          python3 make_paper.py --exclude-recent 3
          python3 gen_index.py

      - name: 试卷自检
        run: |
          paper="papers/408卷_$(date +%F).html"
          python3 check_paper.py questions.json "$paper"

      - name: 清理旧试卷（只保留最近 60 份，控制仓库体积）
        run: |
          cd papers
          ls 408卷_*.html 2>/dev/null | sort | head -n -60 | xargs -r git rm -q
          cd ..

      - name: 提交试卷到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/ index.html wrongbook.html
          if git diff --cached --quiet; then
            echo "今日试卷无变化（可能已生成过），跳过提交"
          else
            git commit -m "每日组卷 $(date +%F)"
            git push
          fi

      - name: 准备 Vercel 部署内容
        run: |
          mkdir -p dist
          cp index.html wrongbook.html questions.json dist/
          cp -r papers dist/

      - name: 部署到 Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest deploy dist --prod --token="$VERCEL_TOKEN" --yes --name 408-quiz
